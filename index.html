<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Buznes</title>
    <meta name="description"
        content="La plateforme Go Buznes (site web et application mobile) est éditée et développée par La société Netiqui ayant Christian CM comme fondateur">
    <meta name="keywords"
        content="Go Buznes, Marché éléctronique RDC, Boutiques Goma, Commerce en ligne RDC, Netiqui product, annonce masisi, tech de l'EST RDC, Le commerce connecté Goma, Christian CM, Netiqui Studio app">
    <meta name="author" content="Netiqui">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_gbz.png">
    <link rel="canonical" href="https://gogamenetiqui.github.io/Go-Buznes/">
    <link rel="stylesheet" href="styles/cap.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Go Buznes Goma","url":"https://gogamenetiqui.github.io/Go-Buznes/index.html"}</script></head>
<body>
    <div class="chargement" id="apercu-chargement">
        <div class="capsule"></div>
        <div class="repere" id="zone-repere">
            <h1>Go <span>Buznes</span></h1>
            <p>Le commerce connecté . Goma</p>
        </div>

        <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
            <div class="chargeur-repere" id="chargeur-block">
                <div class="chargeur-ligne"></div>
            </div>

            <div class="erreur-chargement" id="erreur-block">
                <p>Vous êtes hors-ligne. Activez vos donées pour voi les pepites de Goma</p>
                <button class="btn-ressayer" onclick="tenterConnexion()">Réessayer</button>
            </div>

            <div class="bas-signature">
                <div class="par">de</div>
                <div class="studio">Netiqui</div>
            </div>
        </div>
    </div>
    <script>
        const URL_PRINCIPAL = "home.html";
        const TEMPS_CACHE_48H = 48 * 60 * 60 * 1000;
        async function tenterConnexion() {
            const chargeur = document.getElementById('chargeur-block');
            const erreurBlock = document.getElementById('erreur-block');

            chargeur.style.display = "block";
            erreurBlock.style.display ="none";

            try {
                const reponse = await fetch(URL_PRINCIPAL, { mode: 'no-cors', cache: 'no-store'});

                localStorage.setItem('dernier_acces_reussi', Date.now());

                redirigerVersLien(URL_PRINCIPAL);
            } catch (e) {
                const dernierAcces = localStorage.getItem('dernier_acces_reussi');
                const maintenant = Date.now();

                if (dernierAcces && (maintenant - dernierAcces < TEMPS_CACHE_48H)) {
                    redirigerVersLien(URL_PRINCIPAL)
                } else {
                    chargeur.style.display = "none";
                    erreurBlock.style.display = "block"
                }
            }
        }

        function redirigerVersLien(url) {
            const view = document.getElementById('apercu-chargement');
            if (view) view.classList.add('page-exit');

            setTimeout(() => {
                window.location.href = url;
            }, 350);
        }

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(tenterConnexion, 2500)
        });
    </script>
</body>
</html>
