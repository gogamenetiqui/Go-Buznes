<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée (404) - Go Buznes</title>

    <!-- Métadonnées SEO basiques -->
    <meta name="robots" content="noindex, follow">
    <meta name="article-title" content="Page introuvable">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">

    <style>
        /* ==========================================================================
           STYLES DÉDIÉS : PAGE 404 ERROR
           ========================================================================== */
        
        .error-page-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: var(--radius-lg);
            padding: 60px 40px;
            text-align: center;
            color: #ffffff;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 10px;
            display: inline-block;
            position: relative;
        }

        /* Animation d'icône radar / loupe */
        .error-icon-wrapper {
            font-size: 3rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
            animation: pulse-search 2s infinite ease-in-out;
        }

        @keyframes pulse-search {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .error-card h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .error-card p {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-404-home {
            background: var(--primary-blue);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .btn-404-home:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-404-back {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .btn-404-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Compte à rebours de redirection */
        .redirect-timer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .redirect-timer span {
            color: var(--primary-blue);
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 40px 20px;
            }
            .error-code {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header dynamique (script.js) -->
    <div id="app-header"></div>

    <main class="container">
        
        <div class="error-page-container">
            <div class="error-card">
                
                <div class="error-icon-wrapper">
                    <i class="fa-solid fa-compass-drafting"></i>
                </div>

                <div class="error-code">404</div>
                
                <h1>Oups ! Page introuvable</h1>
                <p>
                    La page que vous recherchez a peut-être été déplacée, supprimée ou n'existe tout simplement pas.
                </p>

                <div class="error-actions">
                    <a href="index.html" class="btn-404-home">
                        <i class="fa-solid fa-house"></i> Retour à l'accueil
                    </a>
                    <button onclick="window.history.back();" class="btn-404-back">
                        <i class="fa-solid fa-arrow-left"></i> Page précédente
                    </button>
                </div>

                <!-- Redirection automatique douce après 10 secondes -->
                <div class="redirect-timer">
                    Redirection automatique vers l'accueil dans <span id="404-countdown">10</span>s...
                </div>

            </div>
        </div>

        <!-- Promo Box Dynamique -->
        <div id="dynamic-promo-box" style="margin-bottom: 40px;"></div>

        <!-- Bannière du Concepteur (script.js) -->
        <div id="app-cta-banner"></div>

    </main>

    <!-- Footer dynamique (script.js) -->
    <div id="app-footer"></div>

    <!-- Moteurs globaux -->
    <script src="temp.js"></script>
    <script src="script.js"></script>

    <!-- SCRIPT DU COMPTE À REBOURS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let seconds = 10;
            const countdownEl = document.getElementById('404-countdown');

            const timer = setInterval(() => {
                seconds--;
                if (countdownEl) countdownEl.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = 'index.html';
                }
            }, 1000);
        });
    </script>
</body>
</html>
