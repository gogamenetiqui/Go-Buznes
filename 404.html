<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - Go Buznes</title>

    <meta name="robots" content="noindex, follow">
    <meta name="article-title" content="Page Introuvable">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="blog/styles/styles.css">

    <style>
        .error-page-container {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .error-card {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-radius: var(--radius-lg);
            padding: 50px 30px;
            text-align: center;
            color: #ffffff;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255, 255, 255, 0.88);
            position: relative;
            overflow: hidden;
        }

        .anim-stage {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 15px;
        }

        .delivery-van {
            font-size: 3.2rem;
            color: var(--primary-blue);
            position:absolute;
            animation: drive-and-explode 2.5s forwards ease-in-out;
        }

        .explosion-flash {
            position: absolute;
            font-size: 4rem;
            color: #f97316;
            opacity: 0;
            transform: scale(0.2);
            animation: boom 0.6s 1.8s forwards ease-out;
        }

        .brand-reveal {
            opacity: 0;
            transform: translateX(15px);
            animation: reveal-logo 0.8s 2.3s forwards ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .brand-reveal .logo-badge {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid var(--primary-blue);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        .brand-reveal .code-404 {
            font-size: 3.8rem;
            font-weight: 800px;
            line-height: 1;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes drive-and-explode {
            0% { transform: translateX(-200px); opacity: 1;}
            60% {transform: translateX(0) scale(1); opacity: 1;}
            75% {transform: translateX(0) scale(1.3); opacity: 1;}
            80% {transform: translateX(0) scale(0); opacity: 0;}
            100% {transform: translateX(0) scale(0); opacity: 0;}
        }

        @keyframes boom {
            0% { transform: scale(0.3); opacity: 0;}
            50% { transform: scale(1.4); opacity: 1;}
            100% { transform: scale(1.8); opacity: 0;}
        }

        @keyframes reveal-logo {
            0% { opacity: 0; transform: translateY(15px);}
            100% { opacity: 1; transform: translateY(0);}
        }

        .error-card h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .error-card p {
            font-size: 0.9rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .error-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-404-home {
            background: var(--primary-blue);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }

        .btn-404-home:hover {
            background: var(--primary-hover);
        }

        .btn-404-back {
            background: rgba(255, 255, 255, 0.88);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            cursor: pointer;
        }

        .redirect-timer {
            margin-top: 20px;
            font-size: 0.72rem;
            color: #64748b;
            letter-spacing: 0.3px;
        }

        .redirect-timer span {
            color: #94a3b8;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div id="app-header"></div>

    <main class="container">
        <div class="error-page-container">
            <div class="error-card">
                <div class="anim-stage">
                    <i class="fa-solid fa-truck-fast delivery-van"></i>
                    <i class="fa-solid fa-burst explosion-flash"></i>

                    <div class="brand-reveal">
                        <span class="logo-badge"><i class="fa-solid fa-bag-shopping brand-icon"></i> Go Buznes</span>
                        <div class="code-404">4G4</div>
                    </div>
                </div>
                <h1>Vous êtes au bon endroit... mais pas dans le bon coin !</h1>
                <p>
                    La livraison de cette page a rencontré un petit imprévu en chemin. La destination demandée n'existe
                    plus ou a été déplacée.
                </p>

                <div class="erro-actions">
                    <a href="index.html" class="btn-404-home">
                        <i class="fa-solid fa-house"></i>Retour à l'acceuil
                    </a>
                    <button onclick="window.history.back();" class="btn-404-back">
                        <i class="fa-solid fa-arrow-left"></i> Retour
                    </button>
                </div>

                <div class="redirect-timer">
                    Redirection dans <span id="404-countdown">10</span>s
                </div>

            </div>
        </div>

        <div id="dynamic-promo-box" style="margin-bottom: 40px;"></div>

        <div id="app-cta-banner"></div>
    </main>

    <div id="app-footer"></div>

    <script src="blog/scripts/config.js"></script>
    <script src="blog/scripts/script.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let seconds = 10;
            const countdownEl = document.getElementById('404-countdown');

            const timer = setInterval(() => {
                seconds--;
                if (countdownEl) countdownEl.textContent = seconds;

                if (seconds <= 0) {
                    clearInterval(timer);
                    window.location.href = 'index.html';
                }
            }, 1000);
        });
    </script>
</body>

</html>
