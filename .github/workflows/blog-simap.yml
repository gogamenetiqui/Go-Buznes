name: Generate Sitemap for Blog

on:
  push:
    branches:
      - main          # ou 'master' 
    paths:
      - 'blog/**'     # Se déclenche seulement si des fichiers sous blog/ sont modifiés
  workflow_dispatch:  # Permet un lancement manuel depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code source
        uses: actions/checkout@v4

      - name: Générer le sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://github.com/netiquiofficial/Go-Buznes/blog/
          paths: ./blog                # Dossier à scanner
          path: ./blog/sitemap.xml     # Fichier de sortie

      - name: (Optionnel) Vérification - upload de l'artéfact
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: ./blog/sitemap.xml
